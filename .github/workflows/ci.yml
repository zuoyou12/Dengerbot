name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Types and UI rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-bun
        with:
          # A type or UI check reads no native module, so skip the install scripts.
          install: ignore-scripts
      - name: Main-process types
        run: bun run typecheck:node
      - name: Renderer types
        run: bun run typecheck:renderer
      - name: UI foundation rules
        run: bun run check:ui
