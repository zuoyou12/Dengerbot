# The LAN Signal + coturn stack: the same services `compose.yaml` runs for the hosted account,
# minus ACME and the control plane. Phones and the desktop reach everything over the private
# network, so the Signal socket serves plain `ws` on 8088 (the health port is 8089) and coturn
# runs without TLS certificates. The tickets are verified against the desktop's own JWKS — the
# mobile-connect service serves it at `/v1/signal-jwks.json`, or `REMOTE_TICKET_PUBLIC_JWKS`
# carries it inline (see `lan.env.example`).
name: openbot-remote-lan

services:
  remote-api:
    build:
      context: ..
      dockerfile: remote/api/Dockerfile
      args:
        OPENBOT_SOURCE_COMMIT: ${OPENBOT_SOURCE_COMMIT:-unknown}
    restart: unless-stopped
    environment:
      REMOTE_SIGNAL_HOST: 0.0.0.0
      REMOTE_SIGNAL_PORT: ${REMOTE_SIGNAL_PORT:-8088}
      REMOTE_HEALTH_PORT: ${REMOTE_HEALTH_PORT:-8089}
      REMOTE_TLS_DISABLED: "true"
      REMOTE_TICKET_JWKS_URL: ${REMOTE_TICKET_JWKS_URL:-}
      REMOTE_TICKET_PUBLIC_JWKS: ${REMOTE_TICKET_PUBLIC_JWKS:-}
      REMOTE_CONTROL_PLANE_URL: ${REMOTE_CONTROL_PLANE_URL:?REMOTE_CONTROL_PLANE_URL is required}
      REMOTE_SESSION_SECRET: ${REMOTE_SESSION_SECRET:?REMOTE_SESSION_SECRET is required}
      REMOTE_AUTH_WEBHOOK_SECRET: ${REMOTE_AUTH_WEBHOOK_SECRET:?REMOTE_AUTH_WEBHOOK_SECRET is required}
      REMOTE_MAX_CONNECTIONS_PER_USER: ${REMOTE_MAX_CONNECTIONS_PER_USER:-32}
      REMOTE_MAX_CONNECTIONS_PER_IP: ${REMOTE_MAX_CONNECTIONS_PER_IP:-32}
      REMOTE_MAX_MESSAGES_PER_MINUTE: ${REMOTE_MAX_MESSAGES_PER_MINUTE:-600}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?TURN_SHARED_SECRET is required}
      TURN_HOST: ${TURN_HOST:-}
      TURN_PORT: 3478
      TURN_TLS_PORT: 5349
    ports:
      - "${REMOTE_SIGNAL_BIND_ADDRESS:-0.0.0.0}:${REMOTE_SIGNAL_PORT:-8088}:${REMOTE_SIGNAL_PORT:-8088}/tcp"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.REMOTE_HEALTH_PORT || 8089) + '/healthz').then(() => process.exit(0), () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

  coturn:
    build:
      context: ..
      dockerfile: remote/coturn/Dockerfile
    container_name: openbot-coturn-lan
    restart: unless-stopped
    environment:
      TURN_PUBLIC_IP: ${TURN_PUBLIC_IP:?TURN_PUBLIC_IP is required}
      TURN_REALM: ${TURN_REALM:-lan}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?TURN_SHARED_SECRET is required}
      TURN_TLS_CERT_PATH: ""
      TURN_TLS_KEY_PATH: ""
    ports:
      - "${TURN_BIND_ADDRESS:-0.0.0.0}:3478:3478/tcp"
      - "${TURN_BIND_ADDRESS:-0.0.0.0}:3478:3478/udp"
      - "${TURN_BIND_ADDRESS:-0.0.0.0}:49160-49200:49160-49200/udp"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "turnutils_stunclient 127.0.0.1 -p 3478 >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 3
